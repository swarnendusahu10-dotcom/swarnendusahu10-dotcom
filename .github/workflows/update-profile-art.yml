name: Update profile art

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths-ignore:
      - "data/**"
      - "*.svg"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py
      - name: Render SVGs
        run: python scripts/render_profile.py
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: swarnendusahu10-dotcom
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58d5e8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update profile art [skip ci]"
          file_pattern: "data/*.json *.svg"
