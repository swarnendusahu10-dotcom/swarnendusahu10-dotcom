<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Profile Preview - Swarnendu Sahu</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 890px;
      width: 100%;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }
    img {
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container center">
    <img src="./header.svg" width="860" alt="Header" />

    <div class="row">
      <img src="./ascii-portrait.svg" width="370" alt="Cat Portrait" />
      <img src="./info-card.svg" width="490" alt="Info Card" />
    </div>

    <div class="row">
      <img src="./globe.svg" width="430" alt="Globe" />
      <img src="./tech-sphere.svg" width="430" alt="Tech Sphere" />
    </div>

    <img src="./github-activity.svg" width="860" alt="Activity Stats" />
    <img src="./contrib-skyline.svg" width="860" alt="Contribution Skyline" />
    <img src="./contrib-heatmap.svg" width="860" alt="Heatmap" />
  </div>
</body>
</html>
